backend:
  name: github
  repo: segunoluyi/portfolio
  branch: main
  base_url: https://segun-portfolio-cms-auth.coolshegs10.workers.dev
  auth_endpoint: /auth

site_url: https://segunoluyi.github.io/portfolio/
display_url: https://segunoluyi.github.io/portfolio/
media_folder: images/uploads
public_folder: images/uploads

collections:
  - name: portfolio_content
    label: Portfolio Content
    files:
      - name: portfolio
        label: Portfolio Site Content
        file: content/portfolio.json
        fields:
          - label: Site settings
            name: site
            widget: object
            fields:
              - { label: Live site URL, name: url, widget: string, required: false }
              - { label: Logo image, name: brand_logo, widget: image, required: false, hint: "Upload a square PNG or SVG, at least 160 × 160 pixels. It appears alone at the top left." }
              - { label: Logo description, name: brand_logo_alt, widget: string, required: false, hint: "Briefly describe your logo for screen-reader users." }
              - { label: Logo placeholder text, name: brand_mark, widget: string, required: false, hint: "Shown only until a logo image is uploaded, for example: LOGO." }
              - { label: Brand name, name: brand_name, widget: string, required: false, hint: "Used as the logo description when one is not written above." }
              - label: Default colour theme
                name: default_theme
                widget: select
                required: false
                hint: "Sets the first theme visitors see. They can still switch between light and dark on the site."
                options:
                  - { label: Light, value: "light" }
                  - { label: Dark, value: "dark" }
              - { label: Browser tab icon, name: favicon, widget: image, required: false, hint: "Upload a square PNG, SVG, or ICO. This controls the small icon in browser tabs." }
              - { label: Copyright year, name: year, widget: string, required: false }
          - label: Profile
            name: profile
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Hero introduction line, name: hero_kicker, widget: string, required: false, hint: "A short line above your name on the homepage." }
              - { label: Professional headshot, name: headshot, widget: image, required: false, hint: "Upload the portrait shown at the top of the homepage." }
              - { label: Headshot description, name: headshot_alt, widget: string, required: false, hint: "Briefly describe the portrait for screen-reader users." }
              - { label: Primary professional title, name: primary_title, widget: string, required: false }
              - { label: Value statement, name: summary, widget: text, required: false, hint: "Use one short sentence that says who you help and the practical outcome." }
              - { label: CV button label, name: cv_label, widget: string, required: false, hint: "For example: Download CV." }
              - { label: Projects button label, name: projects_label, widget: string, required: false, hint: "For example: View projects." }
              - { label: Public CV PDF URL, name: cv_url, widget: string, required: false, hint: "Paste a public PDF link when ready. Leave blank to keep the Download CV button unavailable." }
              - { label: Legacy headline, name: headline, widget: string, required: false }
              - { label: LinkedIn URL, name: linkedin_url, widget: string, required: false }
              - { label: LinkedIn label, name: linkedin_label, widget: string, required: false }
          - label: About section
            name: about
            widget: object
            fields:
              - { label: Section label, name: label, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Subtitle, name: subtitle, widget: string, required: false }
              - { label: Summary, name: summary, widget: text }
          - label: Project cards
            name: projects
            widget: list
            fields:
              - { label: Category or tool, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Image description, name: image_alt, widget: string, required: false, hint: "Describe the project cover for screen-reader users." }
              - { label: Project status, name: status, widget: string, required: false, hint: "Use only when the project has no cover or public link yet, for example: Documentation in preparation." }
              - label: Tools used
                name: tools
                widget: list
                required: false
                field: { label: Tool, name: tool, widget: string }
              - { label: Legacy documentation URL, name: url, widget: string, required: false, hint: "Existing cards can keep using this for documentation. New projects should use the GitHub repository field." }
              - { label: Alternative documentation URL, name: case_study_url, widget: string, required: false, hint: "Use when the documentation is hosted somewhere other than GitHub." }
              - { label: Documentation button label, name: case_study_label, widget: string, required: false, hint: "Optional. Defaults to View documentation when there is no GitHub repository." }
              - { label: GitHub repository URL, name: github_url, widget: string, required: false, hint: "First hover button: View repo. Use this for the README and supporting project files." }
              - { label: Published project URL, name: project_url, widget: string, required: false, hint: "Second hover button: View project. Use for the platform where visitors can interact with the finished work." }
              - { label: Project button label, name: project_label, widget: string, required: false, hint: "Optional. Examples: View dashboard, Open app, View report, View workbook." }
              - { label: Live project URL, name: live_url, widget: string, required: false, hint: "Preferred published destination, such as Power BI Service, Tableau Public, Streamlit, GitHub Pages, or a public workbook." }
              - { label: Published date, name: published_at, widget: datetime, required: false, date_format: "YYYY-MM-DD", time_format: false }
          - label: Homepage highlights
            name: home_highlights
            widget: list
            required: false
            max: 4
            hint: "The four small tiles above Services. Choose a custom value for a verified figure or claim, and update it when your work changes."
            fields:
              - label: Value source
                name: source
                widget: select
                options:
                  - { label: Documented projects, value: "documented_projects" }
                  - { label: Linked business-plan samples, value: "plan_samples" }
                  - { label: Service areas, value: "service_areas" }
                  - { label: Custom text or verified figure, value: "custom" }
              - { label: Custom value or override, name: label_override, widget: string, required: false, hint: "Leave blank to use the automatic count. If you enter a number, check the evidence first and update it when your work changes." }
              - { label: Small caption, name: caption, widget: string }
              - { label: Tile destination, name: url, widget: string, required: false, hint: "Use a page path such as projects/ or samples/, or a section link such as #process." }
          - label: How I work
            name: workflow
            widget: object
            required: false
            fields:
              - { label: Section label, name: label, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Four steps
                name: steps
                widget: list
                min: 4
                max: 4
                fields:
                  - { label: Step title, name: title, widget: string }
                  - { label: Step description, name: description, widget: text }
          - label: Services
            name: services
            widget: list
            required: false
            hint: "Homepage service cards display three across on desktop and wrap to the next row. Each card can link to email or a verified booking or freelance profile. Only add a pricing link when its packages are published and current."
            fields:
              - { label: Service title, name: title, widget: string }
              - label: Icon
                name: icon
                widget: select
                required: false
                options:
                  - { label: Data chart, value: "fa-chart-bar" }
                  - { label: Dashboard, value: "fa-desktop" }
                  - { label: Research, value: "fa-search" }
                  - { label: Document, value: "fa-file-alt" }
                  - { label: Training, value: "fa-chalkboard-teacher" }
              - label: Service points
                name: points
                widget: list
                field: { label: Point, name: point, widget: string }
              - { label: Order or contact URL, name: url, widget: string, required: false, hint: "Paste the exact service destination. Leave blank to use the main contact button. Use a public freelance package URL only when the offer and price are ready." }
              - { label: Button label, name: button_label, widget: string, required: false, default: "Request service", hint: "Use a specific action for this service, such as Request Analysis or Arrange Training." }
          - label: Work samples library
            name: samples
            widget: list
            fields:
              - { label: Sample title, name: title, widget: string }
              - { label: Page slug, name: slug, widget: string, required: true }
              - { label: Document type, name: content_type, widget: select, options: ["Business plan", "Proposal", "Pitch deck", "Market research", "Financial model", "Other work sample"], required: false }
              - { label: Industry, name: industry, widget: string, required: false }
              - { label: Public document URL, name: url, widget: string }
              - { label: Cover image, name: cover_image, widget: image, required: false }
              - { label: Cover-image description, name: cover_alt, widget: string, required: false }
              - { label: Card summary, name: summary, widget: text }
              - { label: About this sample, name: detail_summary, widget: text, required: false }
              - label: What this work covers
                name: key_deliverables
                widget: list
                required: false
                field: { label: Coverage point, name: deliverable, widget: string }
          - label: Insights
            name: insights
            widget: list
            fields:
              - { label: Category or format, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Article URL, name: url, widget: string, required: false }
              - { label: Button label, name: button_label, widget: string, required: false }
              - { label: Published date, name: published_at, widget: datetime, required: false, date_format: "YYYY-MM-DD", time_format: false }
          - label: Contact details
            name: contact
            widget: object
            fields:
              - { label: Location, name: location, widget: string, required: false }
              - { label: Phone, name: phone, widget: string, required: false }
              - { label: Email, name: email, widget: string, required: false }
              - { label: Main contact button label, name: primary_cta_label, widget: string, required: false, hint: "For example: Email me, Message me, or Book a call." }
              - { label: Main contact button URL, name: primary_cta_url, widget: string, required: false, hint: "Paste a complete link. You can use a Gmail compose link, a WhatsApp wa.me link, a booking link, or mailto:address@example.com." }
              - label: Social links
                name: social_links
                widget: list
                required: false
                max: 5
                hint: "Add up to five icons. Leave this list blank to use the existing email, LinkedIn, and GitHub links."
                fields:
                  - label: Icon
                    name: platform
                    widget: select
                    options:
                      - { label: Email, value: "email" }
                      - { label: LinkedIn, value: "linkedin" }
                      - { label: GitHub, value: "github" }
                      - { label: Instagram, value: "instagram" }
                      - { label: X, value: "x" }
                      - { label: Facebook, value: "facebook" }
                      - { label: YouTube, value: "youtube" }
                      - { label: WhatsApp, value: "whatsapp" }
                      - { label: Medium, value: "medium" }
                      - { label: Website, value: "website" }
                  - { label: Link URL, name: url, widget: string, hint: "Paste the complete link, for example https://www.linkedin.com/in/your-name/" }
                  - { label: Accessible label, name: label, widget: string, required: false, hint: "Optional. Used when someone hovers or uses a screen reader." }
              - { label: Legacy LinkedIn URL, name: linkedin_url, widget: string, required: false, hint: "Used only when no Social links have been added above." }
              - { label: Legacy GitHub URL, name: github_url, widget: string, required: false, hint: "Used only when no Social links have been added above." }
          - label: Newsletter and update list
            name: newsletter
            widget: object
            fields:
              - { label: Show this section, name: enabled, widget: boolean, required: false, default: false, hint: "Turn this on only after you have created a real opt-in form or hosted signup page." }
              - { label: Section label, name: label, widget: string, required: false }
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Description, name: summary, widget: text, required: false }
              - { label: Hosted signup page URL, name: subscribe_url, widget: string, required: false, hint: "Paste the public signup-page URL from MailerLite or your chosen email provider. The button opens the provider's secure form." }
              - { label: Button label, name: button_label, widget: string, required: false }
