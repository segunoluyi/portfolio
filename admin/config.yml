backend:
  name: github
  repo: segunoluyi/portfolio
  branch: main
  base_url: https://segun-portfolio-cms-auth.coolshegs10.workers.dev
  auth_endpoint: /auth

site_url: https://segunoluyi.github.io/portfolio/
display_url: https://segunoluyi.github.io/portfolio/
media_folder: images/uploads
public_folder: images/uploads

collections:
  - name: portfolio_content
    label: Portfolio Content
    files:
      - name: portfolio
        label: Portfolio Site Content
        file: content/portfolio.json
        fields:
          - label: Profile
            name: profile
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: LinkedIn URL, name: linkedin_url, widget: string, required: false }
              - { label: LinkedIn label, name: linkedin_label, widget: string, required: false }
          - label: About section
            name: about
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Summary, name: summary, widget: text }
          - label: Project cards
            name: projects
            widget: list
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Project or case-study URL, name: url, widget: string, required: false }
              - { label: Button label, name: button_label, widget: string, required: false }
              - { label: Published date, name: published_at, widget: datetime, required: false, date_format: "YYYY-MM-DD", time_format: false }
          - label: Work samples library
            name: samples
            widget: list
            fields:
              - { label: Sample title, name: title, widget: string }
              - { label: Page slug, name: slug, widget: string, required: true, hint: "The clean page address, for example abc-fishing-company. Use lowercase letters, numbers, and hyphens only." }
              - { label: Document type, name: content_type, widget: select, options: ["Business plan", "Proposal", "Pitch deck", "Market research", "Financial model", "Other work sample"], required: false, hint: "Used by the document-type filter and card label" }
              - { label: Industry, name: industry, widget: string, hint: "Used by the Filter by industry menu" }
              - { label: Public PDF link, name: url, widget: string, hint: "Paste the Google Drive link for the approved public PDF. The View document button uses this link." }
              - { label: Cover image, name: cover_image, widget: image, required: false, hint: "Upload a compressed JPG or WebP cover from the approved public edition. This appears on the card and the left side of the detail page." }
              - { label: Cover-image description, name: cover_alt, widget: string, required: false, hint: "Describe the cover for people using screen readers." }
              - { label: Card summary, name: summary, widget: text, hint: "Write one concise sentence for the Work Samples card. Readers can open the detail page for the fuller story." }
              - { label: Detailed public overview, name: detail_summary, widget: text, required: false, hint: "Write 3 to 4 concise lines for the individual detail page. Keep private information out." }
              - { label: What this work demonstrates, name: work_demonstrates, widget: text, required: false, hint: "One concise sentence describing the capability this sample shows." }
              - label: Key deliverables
                name: key_deliverables
                widget: list
                required: false
                field: { label: Deliverable, name: deliverable, widget: string }
                hint: "Use 3 to 5 short items, such as Market research and segmentation."
          - label: Insights
            name: insights
            widget: list
            fields:
              - { label: Category or format, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Article URL, name: url, widget: string, required: false }
              - { label: Button label, name: button_label, widget: string, required: false }
              - { label: Published date, name: published_at, widget: datetime, required: false, date_format: "YYYY-MM-DD", time_format: false }
          - label: Skills
            name: skills
            widget: list
            field: { label: Skill, name: skill, widget: string }
          - label: Contact details
            name: contact
            widget: object
            fields:
              - { label: Location, name: location, widget: string, required: false }
              - { label: Phone, name: phone, widget: string, required: false }
              - { label: Email, name: email, widget: string, required: false }
              - { label: GitHub URL, name: github_url, widget: string, required: false }
